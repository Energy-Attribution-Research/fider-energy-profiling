name: Fider Energy Profiling (Combined Windows & Mac)

on:
  workflow_dispatch:

jobs:
  profile-windows:
    name: Profile AMD Windows
    runs-on: [self-hosted, Windows]
    permissions:
      contents: write

    env:
      PROJECT_NAME: "fider"
      RUN_ID: "win_${{ github.run_id }}"
      DATA_DIR: "D:\\myPortfolioProject\\fider-energy-profiling\\ResearchData\\cpudata\\win_${{ github.run_id }}"
      UPROF_PATH: "C:\\Program Files\\AMD\\AMDuProf\\bin\\AMDuProfCLI.exe"
      NODE_IMAGE: "node:22-slim"
      GO_IMAGE: "golang:1.25"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Directory Structure
        run: |
          New-Item -ItemType Directory -Force -Path "$env:DATA_DIR\Idle"
          New-Item -ItemType Directory -Force -Path "$env:DATA_DIR\NPM_Install"
          New-Item -ItemType Directory -Force -Path "$env:DATA_DIR\Build_Server"
          New-Item -ItemType Directory -Force -Path "$env:DATA_DIR\Build_UI"
          New-Item -ItemType Directory -Force -Path "$env:DATA_DIR\Test_UI_Spans"
          New-Item -ItemType Directory -Force -Path "$env:DATA_DIR\Test_Server_Spans"
        shell: powershell

      - name: Capture Hardware Metadata
        run: |
          $meta = @{
            platform     = "amd_windows"
            captured_at  = (Get-Date -Format "yyyy-MM-dd HH:mm:ss")
            cpu_model    = (Get-CimInstance Win32_Processor).Name
            cpu_cores    = (Get-CimInstance Win32_Processor).NumberOfCores
            cpu_threads  = (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
            cpu_max_mhz  = (Get-CimInstance Win32_Processor).MaxClockSpeed
            ram_gb       = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
            os_version   = (Get-CimInstance Win32_OperatingSystem).Caption
            docker_ver   = (docker --version)
          }
          $meta | ConvertTo-Json | Out-File -FilePath "$env:DATA_DIR\hardware_metadata.json" -Encoding utf8
        shell: powershell

      - name: Define Windows UTF-8 JSON Writer
        run: |
          @'
          function Write-Utf8JsonNoBom($Path, $Value) {
            $json = $Value | ConvertTo-Json -Compress
            $encoding = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($Path, $json, $encoding)
          }
          '@ | Out-File -FilePath "$env:DATA_DIR\write-json.ps1" -Encoding ascii
        shell: powershell

      - name: Pre-pull Images
        run: |
          docker pull --platform linux/amd64 $env:NODE_IMAGE
          docker pull --platform linux/amd64 $env:GO_IMAGE
          docker pull postgres:17
          docker pull getfider/minio:0.0.2
        shell: powershell

      # --- SCENARIO 1: IDLE ---
      - name: Profile Idle Scenario
        run: |
          $w3cTraceparent = "00-$((New-Guid).Guid.Replace('-',''))-$(((New-Guid).Guid.Replace('-','')).Substring(0,16))-01"
          $uprof = Start-Process -FilePath "$env:UPROF_PATH" -ArgumentList "timechart --event power --interval 100 -d 60 -o `"$env:DATA_DIR\Idle\power_data.csv`"" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          $startTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"
          Start-Sleep -Seconds 30
          $endTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"
          Start-Sleep -Seconds 10
          Stop-Process -Id $uprof.Id -Force -ErrorAction SilentlyContinue
          echo "Idle_Start,$startTime,$w3cTraceparent" > "$env:DATA_DIR\Idle\timestamps.csv"
          echo "Idle_End,$endTime,$w3cTraceparent" >> "$env:DATA_DIR\Idle\timestamps.csv"
        shell: powershell

      # --- SCENARIO 2: NPM INSTALL ---
      - name: Profile NPM Install
        run: |
          $w3cTraceparent = "00-$((New-Guid).Guid.Replace('-',''))-$(((New-Guid).Guid.Replace('-','')).Substring(0,16))-01"
          $profilerCap = 600
          $uprof = Start-Process -FilePath "$env:UPROF_PATH" -ArgumentList "timechart --event power --interval 100 -d $profilerCap -o `"$env:DATA_DIR\NPM_Install\power_data.csv`"" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          $startTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"
          docker run --rm -v "${PWD}:/app" -w /app --platform linux/amd64 $env:NODE_IMAGE npm ci ; $global:LASTEXITCODE = 0
          $endTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"
          Start-Sleep -Seconds 10
          Stop-Process -Id $uprof.Id -Force -ErrorAction SilentlyContinue
          echo "NPM_Install_Start,$startTime,$w3cTraceparent" > "$env:DATA_DIR\NPM_Install\timestamps.csv"
          echo "NPM_Install_End,$endTime,$w3cTraceparent" >> "$env:DATA_DIR\NPM_Install\timestamps.csv"
          $actualSec = ((Get-Date $endTime) - (Get-Date $startTime)).TotalSeconds
          $usableCap = $profilerCap - 20
          $truncated = $actualSec -gt $usableCap
          . "$env:DATA_DIR\write-json.ps1"
          Write-Utf8JsonNoBom "$env:DATA_DIR\NPM_Install\duration_check.json" @{ task_seconds = [math]::Round($actualSec,2); profiler_cap_seconds = $profilerCap; usable_cap_seconds = $usableCap; truncated = $truncated }
          if ($truncated) { Write-Error "TRUNCATED: NPM Install ran ${actualSec}s but usable cap was ${usableCap}s"; exit 1 }
        shell: powershell

      # --- SCENARIO 3: BUILD SERVER (Go compilation) ---
      - name: Profile Build Server
        run: |
          $w3cTraceparent = "00-$((New-Guid).Guid.Replace('-',''))-$(((New-Guid).Guid.Replace('-','')).Substring(0,16))-01"
          $profilerCap = 300
          $uprof = Start-Process -FilePath "$env:UPROF_PATH" -ArgumentList "timechart --event power --interval 100 -d $profilerCap -o `"$env:DATA_DIR\Build_Server\power_data.csv`"" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          $startTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"
          docker run --rm -v "${PWD}:/app" -w /app --platform linux/amd64 $env:GO_IMAGE go build -ldflags "-s -w" -o fider . ; $global:LASTEXITCODE = 0
          $endTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"
          Start-Sleep -Seconds 10
          Stop-Process -Id $uprof.Id -Force -ErrorAction SilentlyContinue
          echo "Build_Server_Start,$startTime,$w3cTraceparent" > "$env:DATA_DIR\Build_Server\timestamps.csv"
          echo "Build_Server_End,$endTime,$w3cTraceparent" >> "$env:DATA_DIR\Build_Server\timestamps.csv"
          $actualSec = ((Get-Date $endTime) - (Get-Date $startTime)).TotalSeconds
          $usableCap = $profilerCap - 20
          $truncated = $actualSec -gt $usableCap
          . "$env:DATA_DIR\write-json.ps1"
          Write-Utf8JsonNoBom "$env:DATA_DIR\Build_Server\duration_check.json" @{ task_seconds = [math]::Round($actualSec,2); profiler_cap_seconds = $profilerCap; usable_cap_seconds = $usableCap; truncated = $truncated }
          if ($truncated) { Write-Error "TRUNCATED: Build_Server ran ${actualSec}s but usable cap was ${usableCap}s"; exit 1 }
        shell: powershell

      # --- SCENARIO 4: BUILD UI (webpack) ---
      - name: Profile Build UI
        run: |
          $w3cTraceparent = "00-$((New-Guid).Guid.Replace('-',''))-$(((New-Guid).Guid.Replace('-','')).Substring(0,16))-01"
          $profilerCap = 300
          $uprof = Start-Process -FilePath "$env:UPROF_PATH" -ArgumentList "timechart --event power --interval 100 -d $profilerCap -o `"$env:DATA_DIR\Build_UI\power_data.csv`"" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          $startTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"
          docker run --rm -v "${PWD}:/app" -w /app --platform linux/amd64 $env:NODE_IMAGE sh -c "NODE_ENV=production npx webpack-cli" ; $global:LASTEXITCODE = 0
          $endTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"
          Start-Sleep -Seconds 10
          Stop-Process -Id $uprof.Id -Force -ErrorAction SilentlyContinue
          echo "Build_UI_Start,$startTime,$w3cTraceparent" > "$env:DATA_DIR\Build_UI\timestamps.csv"
          echo "Build_UI_End,$endTime,$w3cTraceparent" >> "$env:DATA_DIR\Build_UI\timestamps.csv"
          $actualSec = ((Get-Date $endTime) - (Get-Date $startTime)).TotalSeconds
          $usableCap = $profilerCap - 20
          $truncated = $actualSec -gt $usableCap
          . "$env:DATA_DIR\write-json.ps1"
          Write-Utf8JsonNoBom "$env:DATA_DIR\Build_UI\duration_check.json" @{ task_seconds = [math]::Round($actualSec,2); profiler_cap_seconds = $profilerCap; usable_cap_seconds = $usableCap; truncated = $truncated }
          if ($truncated) { Write-Error "TRUNCATED: Build_UI ran ${actualSec}s but usable cap was ${usableCap}s"; exit 1 }
        shell: powershell

      # --- SCENARIO 5: TEST UI SPANS (Jest per directory) ---
      - name: Profile Test UI Spans
        run: |
          $scenario = "Test_UI_Spans"
          $scenarioDir = Join-Path $env:DATA_DIR $scenario
          $rawSpans = Join-Path $scenarioDir "pipeline_spans.ndjson"
          $spansJson = Join-Path $scenarioDir "spans.json"
          Remove-Item -LiteralPath $rawSpans, $spansJson -Force -ErrorAction SilentlyContinue

          $w3cTraceparent = "00-$((New-Guid).Guid.Replace('-',''))-$(((New-Guid).Guid.Replace('-','')).Substring(0,16))-01"
          $profilerCap = 600
          $uprof = Start-Process -FilePath "$env:UPROF_PATH" -ArgumentList "timechart --event power --interval 100 -d $profilerCap -o `"$scenarioDir\power_data.csv`"" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10

          $failedSpanCount = 0
          $scenarioStartClock = Get-Date
          $startTime = $scenarioStartClock.ToString("yyyy-MM-dd HH:mm:ss.fff")
          $startEpochMs = [DateTimeOffset]::new($scenarioStartClock, [System.TimeZoneInfo]::Local.GetUtcOffset($scenarioStartClock)).ToUnixTimeMilliseconds()

          Write-Host "Starting persistent Node runner container..."
          $containerId = [string](docker run -d -v "${PWD}:/app" -w /app --platform linux/amd64 $env:NODE_IMAGE sleep infinity | Select-Object -Last 1)
          $containerId = $containerId.Trim()
          if ([string]::IsNullOrWhiteSpace($containerId)) { throw "Failed to start persistent Node container" }

          function Invoke-UISpan {
            param(
              [string]$Name,
              [string]$TestPath,
              [string[]]$JestArgs,
              [bool]$Calibration = $false
            )
            $startMs = [DateTimeOffset]::Now.ToUnixTimeMilliseconds()
            $execArgs = @("exec", $containerId, "npx", "jest") + $JestArgs + @("--passWithNoTests")
            & docker @execArgs
            $exitCode = $LASTEXITCODE
            $endMs = [DateTimeOffset]::Now.ToUnixTimeMilliseconds()
            if ($exitCode -ne 0 -and -not $Calibration) { $script:failedSpanCount += 1; Write-Warning "Span $Name exited $exitCode" }
            $commandText = "npx jest " + ($JestArgs -join " ") + " --passWithNoTests"
            node scripts\make_pipeline_spans.js record `
              --output "$rawSpans" --name "$Name" --start-ms "$startMs" --end-ms "$endMs" `
              --exit-code "$exitCode" --test-path "$TestPath" --command "$commandText" `
              --calibration "$Calibration" --operation "jest-directory"
            if ($LASTEXITCODE -ne 0) { throw "Failed to record span $Name" }
          }

          for ($i = 1; $i -le 3; $i++) {
            Invoke-UISpan -Name "jest.Calibration.$i" -TestPath "" -JestArgs @("--testPathPattern=^NO_MATCH$") -Calibration $true
          }

          foreach ($dir in @("components", "pages", "services")) {
            Invoke-UISpan -Name "jest.$dir" -TestPath "public/$dir" -JestArgs @("./public/$dir")
          }

          $scenarioEndClock = Get-Date
          $endTime = $scenarioEndClock.ToString("yyyy-MM-dd HH:mm:ss.fff")

          docker stop $containerId | Out-Null
          docker rm  $containerId | Out-Null

          Start-Sleep -Seconds 10
          Stop-Process -Id $uprof.Id -Force -ErrorAction SilentlyContinue

          echo "${scenario}_Start,$startTime,$w3cTraceparent,$startEpochMs" > "$scenarioDir\timestamps.csv"
          echo "${scenario}_End,$endTime,$w3cTraceparent" >> "$scenarioDir\timestamps.csv"

          node scripts\make_pipeline_spans.js build --input "$rawSpans" --output "$spansJson" --traceparent "$w3cTraceparent" --scenario "$scenario"
          if ($LASTEXITCODE -ne 0) { throw "Failed to build spans.json for $scenario" }

          $actualSec = ($scenarioEndClock - $scenarioStartClock).TotalSeconds
          $usableCap = $profilerCap - 20
          $truncated = $actualSec -gt $usableCap
          $spanCount = @(Get-Content -LiteralPath $rawSpans | Where-Object { $_.Trim().Length -gt 0 }).Count
          . "$env:DATA_DIR\write-json.ps1"
          Write-Utf8JsonNoBom "$scenarioDir\duration_check.json" @{ scenario = $scenario; profiler_cap_seconds = $profilerCap; usable_cap_seconds = $usableCap; actual_duration_seconds = [math]::Round($actualSec,2); task_seconds = [math]::Round($actualSec,2); truncated = $truncated; span_count = $spanCount; failed_span_count = $failedSpanCount }

          if ($spanCount -ne 6) { Write-Error "Expected 6 spans but found $spanCount"; exit 1 }
          if ($truncated) { Write-Error "TRUNCATED: Test_UI_Spans ran ${actualSec}s but usable cap was ${usableCap}s"; exit 1 }
        shell: powershell

      # --- SCENARIO 6: TEST SERVER SPANS (go test per package, needs PostgreSQL + MinIO) ---
      - name: Setup Infrastructure for Test Server Spans
        run: |
          $netName = "fider-energy-net-$env:RUN_ID"
          docker network create $netName | Out-Null

          docker run -d --name "fider-pgtest-$env:RUN_ID" --network $netName `
            -e POSTGRES_USER=fider_ci -e POSTGRES_PASSWORD=fider_ci_pw -e POSTGRES_DB=fider_ci `
            postgres:17

          docker run -d --name "fider-s3test-$env:RUN_ID" --network $netName `
            -e MINIO_ACCESS_KEY=s3user -e MINIO_SECRET_KEY=s3user-s3cr3t `
            getfider/minio:0.0.2 server /data

          Write-Host "Waiting for PostgreSQL to be ready..."
          $retries = 30
          while ($retries -gt 0) {
            $result = docker exec "fider-pgtest-$env:RUN_ID" pg_isready -U fider_ci 2>&1
            if ($LASTEXITCODE -eq 0) { Write-Host "PostgreSQL ready."; break }
            Start-Sleep -Seconds 2
            $retries -= 1
          }
          if ($retries -eq 0) { throw "PostgreSQL did not become ready in time" }

          Write-Host "Building Go binary and running migrations..."
          $dbUrl = "postgres://fider_ci:fider_ci_pw@fider-pgtest-$env:RUN_ID`:5432/fider_ci?sslmode=disable"
          docker run --rm --network $netName -v "${PWD}:/app" -w /app --platform linux/amd64 `
            -e DATABASE_URL=$dbUrl `
            -e BLOB_STORAGE_S3_ENDPOINT_URL="http://fider-s3test-$env:RUN_ID`:9000" `
            -e BLOB_STORAGE_S3_ACCESS_KEY_ID=s3user `
            -e BLOB_STORAGE_S3_SECRET_ACCESS_KEY=s3user-s3cr3t `
            $env:GO_IMAGE sh -c "mkdir -p dist && go build -ldflags '-s -w' -o fider . && ./fider migrate"
          Write-Host "Infrastructure ready."
        shell: powershell

      - name: Profile Test Server Spans
        run: |
          $scenario = "Test_Server_Spans"
          $scenarioDir = Join-Path $env:DATA_DIR $scenario
          $rawSpans = Join-Path $scenarioDir "pipeline_spans.ndjson"
          $spansJson = Join-Path $scenarioDir "spans.json"
          Remove-Item -LiteralPath $rawSpans, $spansJson -Force -ErrorAction SilentlyContinue

          $w3cTraceparent = "00-$((New-Guid).Guid.Replace('-',''))-$(((New-Guid).Guid.Replace('-','')).Substring(0,16))-01"
          $netName = "fider-energy-net-$env:RUN_ID"
          $dbUrl = "postgres://fider_ci:fider_ci_pw@fider-pgtest-$env:RUN_ID`:5432/fider_ci?sslmode=disable"
          $profilerCap = 1800
          $uprof = Start-Process -FilePath "$env:UPROF_PATH" -ArgumentList "timechart --event power --interval 100 -d $profilerCap -o `"$scenarioDir\power_data.csv`"" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10

          $failedSpanCount = 0
          $scenarioStartClock = Get-Date
          $startTime = $scenarioStartClock.ToString("yyyy-MM-dd HH:mm:ss.fff")
          $startEpochMs = [DateTimeOffset]::new($scenarioStartClock, [System.TimeZoneInfo]::Local.GetUtcOffset($scenarioStartClock)).ToUnixTimeMilliseconds()

          Write-Host "Starting persistent Go runner container..."
          $containerId = [string](docker run -d --network $netName -v "${PWD}:/app" -w /app --platform linux/amd64 `
            -e DATABASE_URL=$dbUrl `
            -e BLOB_STORAGE_S3_ENDPOINT_URL="http://fider-s3test-$env:RUN_ID`:9000" `
            -e BLOB_STORAGE_S3_ACCESS_KEY_ID=s3user `
            -e BLOB_STORAGE_S3_SECRET_ACCESS_KEY=s3user-s3cr3t `
            $env:GO_IMAGE sleep infinity | Select-Object -Last 1)
          $containerId = $containerId.Trim()
          if ([string]::IsNullOrWhiteSpace($containerId)) { throw "Failed to start persistent Go container" }

          function Invoke-GoSpan {
            param([string]$Name, [string]$Package, [bool]$Calibration = $false)
            $startMs = [DateTimeOffset]::Now.ToUnixTimeMilliseconds()
            docker exec $containerId go test $Package -short -count=1
            $exitCode = $LASTEXITCODE
            $endMs = [DateTimeOffset]::Now.ToUnixTimeMilliseconds()
            if ($exitCode -ne 0 -and -not $Calibration) { $script:failedSpanCount += 1; Write-Warning "Span $Name exited $exitCode" }
            node scripts\make_pipeline_spans.js record `
              --output "$rawSpans" --name "$Name" --start-ms "$startMs" --end-ms "$endMs" `
              --exit-code "$exitCode" --test-path "$Package" --command "go test $Package -short -count=1" `
              --calibration "$Calibration" --operation "gotest-package"
            if ($LASTEXITCODE -ne 0) { throw "Failed to record span $Name" }
          }

          for ($i = 1; $i -le 3; $i++) {
            Invoke-GoSpan -Name "gotest.Calibration.$i" -Package "./app/models/..." -Calibration $true
          }

          $packages = @("actions","cmd","handlers","jobs","middlewares","models","pkg","services","tasks")
          foreach ($pkg in $packages) {
            Invoke-GoSpan -Name "gotest.$pkg" -Package "./app/$pkg/..."
          }

          $scenarioEndClock = Get-Date
          $endTime = $scenarioEndClock.ToString("yyyy-MM-dd HH:mm:ss.fff")

          docker stop $containerId | Out-Null
          docker rm  $containerId | Out-Null

          Start-Sleep -Seconds 10
          Stop-Process -Id $uprof.Id -Force -ErrorAction SilentlyContinue

          echo "${scenario}_Start,$startTime,$w3cTraceparent,$startEpochMs" > "$scenarioDir\timestamps.csv"
          echo "${scenario}_End,$endTime,$w3cTraceparent" >> "$scenarioDir\timestamps.csv"

          node scripts\make_pipeline_spans.js build --input "$rawSpans" --output "$spansJson" --traceparent "$w3cTraceparent" --scenario "$scenario"
          if ($LASTEXITCODE -ne 0) { throw "Failed to build spans.json for $scenario" }

          $actualSec = ($scenarioEndClock - $scenarioStartClock).TotalSeconds
          $usableCap = $profilerCap - 20
          $truncated = $actualSec -gt $usableCap
          $spanCount = @(Get-Content -LiteralPath $rawSpans | Where-Object { $_.Trim().Length -gt 0 }).Count
          . "$env:DATA_DIR\write-json.ps1"
          Write-Utf8JsonNoBom "$scenarioDir\duration_check.json" @{ scenario = $scenario; profiler_cap_seconds = $profilerCap; usable_cap_seconds = $usableCap; actual_duration_seconds = [math]::Round($actualSec,2); task_seconds = [math]::Round($actualSec,2); truncated = $truncated; span_count = $spanCount; failed_span_count = $failedSpanCount; calibration_repetitions = 3 }

          if ($spanCount -ne 12) { Write-Error "Expected 12 spans but found $spanCount"; exit 1 }
          if ($truncated) { Write-Error "TRUNCATED: Test_Server_Spans ran ${actualSec}s but usable cap was ${usableCap}s"; exit 1 }
        shell: powershell

      - name: Cleanup Infrastructure
        if: always()
        run: |
          $netName = "fider-energy-net-$env:RUN_ID"
          docker stop "fider-pgtest-$env:RUN_ID" "fider-s3test-$env:RUN_ID" 2>$null
          docker rm   "fider-pgtest-$env:RUN_ID" "fider-s3test-$env:RUN_ID" 2>$null
          docker network rm $netName 2>$null
          Write-Host "Infrastructure cleaned up."
        shell: powershell

      - name: Upload Traces as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-traces-${{ env.RUN_ID }}
          path: ${{ env.DATA_DIR }}
          retention-days: 90

      - name: Offload to MinIO Bucket
        env:
          AWS_ACCESS_KEY_ID: researcher
          AWS_SECRET_ACCESS_KEY: supersecretpassword
          AWS_DEFAULT_REGION: us-east-1
        run: |
          Write-Host "Compressing Raw Telemetry..."
          $scenarios = @("Idle", "NPM_Install", "Build_Server", "Build_UI", "Test_UI_Spans", "Test_Server_Spans")
          foreach ($scenario in $scenarios) {
            $scenarioDir = Join-Path $env:DATA_DIR $scenario
            $rootTimechart = Join-Path $scenarioDir "timechart.csv"
            $timestamps = Join-Path $scenarioDir "timestamps.csv"

            if (-not (Test-Path -LiteralPath $rootTimechart)) {
              $nested = Get-ChildItem -LiteralPath $scenarioDir -Recurse -Filter "timechart.csv" -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($null -eq $nested) { throw "Missing timechart.csv for $scenario" }
              Copy-Item -LiteralPath $nested.FullName -Destination $rootTimechart -Force
            }

            foreach ($f in @($rootTimechart, $timestamps)) {
              if (-not (Test-Path -LiteralPath $f)) { throw "Missing: $f" }
              if ((Get-Item -LiteralPath $f).Length -eq 0) { throw "Empty: $f" }
            }

            $files = @($rootTimechart, $timestamps)
            $durationCheck = Join-Path $scenarioDir "duration_check.json"
            if (Test-Path -LiteralPath $durationCheck) { $files += $durationCheck }
            foreach ($spanScenario in @("Test_UI_Spans", "Test_Server_Spans")) {
              if ($scenario -eq $spanScenario) {
                $spansJson = Join-Path $scenarioDir "spans.json"
                if (-not (Test-Path -LiteralPath $spansJson)) { throw "Missing spans.json for $scenario" }
                if ((Get-Item -LiteralPath $spansJson).Length -eq 0) { throw "Empty spans.json for $scenario" }
                $files += $spansJson
              }
            }
            Compress-Archive -LiteralPath $files -DestinationPath "$env:DATA_DIR\$scenario.zip" -Force
          }

          $awsExe = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          & $awsExe s3 cp "$env:DATA_DIR\hardware_metadata.json" "s3://energy-research-data/raw-telemetry/$env:PROJECT_NAME/$env:RUN_ID/hardware_metadata.json" --endpoint-url http://100.67.86.32:9000
          foreach ($scenario in $scenarios) {
            & $awsExe s3 cp "$env:DATA_DIR\$scenario.zip" "s3://energy-research-data/raw-telemetry/$env:PROJECT_NAME/$env:RUN_ID/$scenario.zip" --endpoint-url http://100.67.86.32:9000
          }
          Remove-Item -Path "$env:DATA_DIR" -Recurse -Force
        shell: powershell

  profile-mac:
    name: Profile Apple Mac M2
    runs-on: [self-hosted, macos]
    permissions:
      contents: write

    env:
      PROJECT_NAME: "fider"
      RUN_ID: "mac_${{ github.run_id }}"
      DATA_DIR: "${{ github.workspace }}/ResearchData/cpudata/mac_${{ github.run_id }}"
      NODE_IMAGE: "node:22-slim"
      GO_IMAGE: "golang:1.25"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Directory Structure
        run: |
          mkdir -p "$DATA_DIR/Idle"
          mkdir -p "$DATA_DIR/NPM_Install"
          mkdir -p "$DATA_DIR/Build_Server"
          mkdir -p "$DATA_DIR/Build_UI"
          mkdir -p "$DATA_DIR/Test_UI_Spans"
          mkdir -p "$DATA_DIR/Test_Server_Spans"
        shell: bash

      - name: Capture Hardware Metadata
        run: |
          META_FILE="$DATA_DIR/hardware_metadata.json"
          CPU_MODEL=$(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo "Apple Silicon")
          TOTAL_CORES=$(sysctl -n hw.physicalcpu)
          CPU_THREADS=$(sysctl -n hw.logicalcpu)
          RAM_GB=$(echo "scale=1; $(sysctl -n hw.memsize) / 1073741824" | bc)
          OS_VER=$(sw_vers -productVersion)
          DOCKER_VER=$(docker --version)
          cat > "$META_FILE" << EOFMETA
          {
            "platform": "mac_m2_macos",
            "captured_at": "$(date '+%Y-%m-%d %H:%M:%S')",
            "cpu_model": "$CPU_MODEL",
            "cpu_cores": $TOTAL_CORES,
            "cpu_threads": $CPU_THREADS,
            "ram_gb": $RAM_GB,
            "os_version": "macOS $OS_VER",
            "docker_ver": "$DOCKER_VER"
          }
          EOFMETA
        shell: bash

      - name: Pre-pull Images
        run: |
          docker pull --platform linux/arm64 "$NODE_IMAGE"
          docker pull --platform linux/arm64 "$GO_IMAGE"
          docker pull postgres:17
          docker pull getfider/minio:0.0.2
        shell: bash

      # --- SCENARIO 1: IDLE ---
      - name: Profile Idle Scenario
        run: |
          W3C_TRACEPARENT="00-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]')-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-16)-01"
          sudo powermetrics --samplers cpu_power -i 100 -n 600 > "$DATA_DIR/Idle/power_data.txt" 2>/dev/null &
          PROF_PID=$!
          sleep 10
          START_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          sleep 30
          END_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          sleep 10
          sudo kill $PROF_PID 2>/dev/null || true; wait $PROF_PID 2>/dev/null || true
          echo "Idle_Start,$START_TIME,$W3C_TRACEPARENT" > "$DATA_DIR/Idle/timestamps.csv"
          echo "Idle_End,$END_TIME,$W3C_TRACEPARENT" >> "$DATA_DIR/Idle/timestamps.csv"
        shell: bash

      # --- SCENARIO 2: NPM INSTALL ---
      - name: Profile NPM Install
        run: |
          W3C_TRACEPARENT="00-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]')-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-16)-01"
          PROFILER_CAP=600
          sudo powermetrics --samplers cpu_power -i 100 -n $((PROFILER_CAP * 10)) > "$DATA_DIR/NPM_Install/power_data.txt" 2>/dev/null &
          PROF_PID=$!
          sleep 10
          START_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          docker run --rm -v "${PWD}:/app" -w /app --platform linux/arm64 "$NODE_IMAGE" npm ci || true
          END_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          sleep 10
          sudo kill $PROF_PID 2>/dev/null || true; wait $PROF_PID 2>/dev/null || true
          echo "NPM_Install_Start,$START_TIME,$W3C_TRACEPARENT" > "$DATA_DIR/NPM_Install/timestamps.csv"
          echo "NPM_Install_End,$END_TIME,$W3C_TRACEPARENT" >> "$DATA_DIR/NPM_Install/timestamps.csv"
          ACTUAL_SEC=$(python3 -c "from datetime import datetime; s=datetime.strptime('$START_TIME','%Y-%m-%d %H:%M:%S.%f'); e=datetime.strptime('$END_TIME','%Y-%m-%d %H:%M:%S.%f'); print(round((e-s).total_seconds(),2))")
          USABLE_CAP=$((PROFILER_CAP - 20))
          TRUNCATED=$(python3 -c "print('true' if $ACTUAL_SEC > $USABLE_CAP else 'false')")
          echo "{\"task_seconds\": $ACTUAL_SEC, \"profiler_cap_seconds\": $PROFILER_CAP, \"usable_cap_seconds\": $USABLE_CAP, \"truncated\": $TRUNCATED}" > "$DATA_DIR/NPM_Install/duration_check.json"
          if [ "$TRUNCATED" = "true" ]; then echo "TRUNCATED: NPM Install ran ${ACTUAL_SEC}s but usable cap was ${USABLE_CAP}s"; exit 1; fi
        shell: bash

      # --- SCENARIO 3: BUILD SERVER (Go compilation) ---
      - name: Profile Build Server
        run: |
          W3C_TRACEPARENT="00-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]')-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-16)-01"
          PROFILER_CAP=300
          sudo powermetrics --samplers cpu_power -i 100 -n $((PROFILER_CAP * 10)) > "$DATA_DIR/Build_Server/power_data.txt" 2>/dev/null &
          PROF_PID=$!
          sleep 10
          START_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          docker run --rm -v "${PWD}:/app" -w /app --platform linux/arm64 "$GO_IMAGE" go build -ldflags "-s -w" -o fider . || true
          END_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          sleep 10
          sudo kill $PROF_PID 2>/dev/null || true; wait $PROF_PID 2>/dev/null || true
          echo "Build_Server_Start,$START_TIME,$W3C_TRACEPARENT" > "$DATA_DIR/Build_Server/timestamps.csv"
          echo "Build_Server_End,$END_TIME,$W3C_TRACEPARENT" >> "$DATA_DIR/Build_Server/timestamps.csv"
          ACTUAL_SEC=$(python3 -c "from datetime import datetime; s=datetime.strptime('$START_TIME','%Y-%m-%d %H:%M:%S.%f'); e=datetime.strptime('$END_TIME','%Y-%m-%d %H:%M:%S.%f'); print(round((e-s).total_seconds(),2))")
          USABLE_CAP=$((PROFILER_CAP - 20))
          TRUNCATED=$(python3 -c "print('true' if $ACTUAL_SEC > $USABLE_CAP else 'false')")
          echo "{\"task_seconds\": $ACTUAL_SEC, \"profiler_cap_seconds\": $PROFILER_CAP, \"usable_cap_seconds\": $USABLE_CAP, \"truncated\": $TRUNCATED}" > "$DATA_DIR/Build_Server/duration_check.json"
          if [ "$TRUNCATED" = "true" ]; then echo "TRUNCATED: Build_Server ran ${ACTUAL_SEC}s but usable cap was ${USABLE_CAP}s"; exit 1; fi
        shell: bash

      # --- SCENARIO 4: BUILD UI (webpack) ---
      - name: Profile Build UI
        run: |
          W3C_TRACEPARENT="00-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]')-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-16)-01"
          PROFILER_CAP=300
          sudo powermetrics --samplers cpu_power -i 100 -n $((PROFILER_CAP * 10)) > "$DATA_DIR/Build_UI/power_data.txt" 2>/dev/null &
          PROF_PID=$!
          sleep 10
          START_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          docker run --rm -v "${PWD}:/app" -w /app --platform linux/arm64 "$NODE_IMAGE" sh -c "NODE_ENV=production npx webpack-cli" || true
          END_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          sleep 10
          sudo kill $PROF_PID 2>/dev/null || true; wait $PROF_PID 2>/dev/null || true
          echo "Build_UI_Start,$START_TIME,$W3C_TRACEPARENT" > "$DATA_DIR/Build_UI/timestamps.csv"
          echo "Build_UI_End,$END_TIME,$W3C_TRACEPARENT" >> "$DATA_DIR/Build_UI/timestamps.csv"
          ACTUAL_SEC=$(python3 -c "from datetime import datetime; s=datetime.strptime('$START_TIME','%Y-%m-%d %H:%M:%S.%f'); e=datetime.strptime('$END_TIME','%Y-%m-%d %H:%M:%S.%f'); print(round((e-s).total_seconds(),2))")
          USABLE_CAP=$((PROFILER_CAP - 20))
          TRUNCATED=$(python3 -c "print('true' if $ACTUAL_SEC > $USABLE_CAP else 'false')")
          echo "{\"task_seconds\": $ACTUAL_SEC, \"profiler_cap_seconds\": $PROFILER_CAP, \"usable_cap_seconds\": $USABLE_CAP, \"truncated\": $TRUNCATED}" > "$DATA_DIR/Build_UI/duration_check.json"
          if [ "$TRUNCATED" = "true" ]; then echo "TRUNCATED: Build_UI ran ${ACTUAL_SEC}s but usable cap was ${USABLE_CAP}s"; exit 1; fi
        shell: bash

      # --- SCENARIO 5: TEST UI SPANS (Jest per directory) ---
      - name: Profile Test UI Spans
        run: |
          set -euo pipefail
          SCENARIO="Test_UI_Spans"
          SCENARIO_DIR="$DATA_DIR/$SCENARIO"
          RAW_SPANS="$SCENARIO_DIR/pipeline_spans.ndjson"
          SPANS_JSON="$SCENARIO_DIR/spans.json"
          rm -f "$RAW_SPANS" "$SPANS_JSON"

          W3C_TRACEPARENT="00-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]')-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-16)-01"
          PROFILER_CAP=600
          sudo powermetrics --samplers cpu_power -i 100 -n $((PROFILER_CAP * 10)) > "$SCENARIO_DIR/power_data.txt" 2>/dev/null &
          PROF_PID=$!
          sleep 10

          FAILED_SPAN_COUNT=0
          START_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          START_EPOCH_MS=$(node -e "console.log(Date.now())")

          CONTAINER_ID=$(docker run -d -v "${PWD}:/app" -w /app --platform linux/arm64 "$NODE_IMAGE" sleep infinity)
          CONTAINER_ID=$(echo "$CONTAINER_ID" | tr -d '[:space:]')
          if [ -z "$CONTAINER_ID" ]; then echo "Failed to start persistent Node container"; exit 1; fi

          run_ui_span() {
            local name="$1" calibration="$2" test_path="$3"
            shift 3
            local start_ms end_ms exit_code
            start_ms=$(node -e "console.log(Date.now())")
            set +e
            docker exec "$CONTAINER_ID" npx jest "$@" --passWithNoTests
            exit_code=$?
            set -e
            end_ms=$(node -e "console.log(Date.now())")
            if [ "$exit_code" -ne 0 ] && [ "$calibration" != "true" ]; then
              FAILED_SPAN_COUNT=$((FAILED_SPAN_COUNT + 1))
              echo "WARNING: Span $name exited $exit_code"
            fi
            node scripts/make_pipeline_spans.js record \
              --output "$RAW_SPANS" --name "$name" --start-ms "$start_ms" --end-ms "$end_ms" \
              --exit-code "$exit_code" --test-path "$test_path" --command "npx jest $* --passWithNoTests" \
              --calibration "$calibration" --operation "jest-directory"
          }

          for REP in 1 2 3; do
            run_ui_span "jest.Calibration.$REP" "true" "" --testPathPattern="^NO_MATCH$"
          done

          for DIR in components pages services; do
            run_ui_span "jest.$DIR" "false" "public/$DIR" "./public/$DIR"
          done

          END_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")

          docker stop "$CONTAINER_ID" >/dev/null 2>&1 || true
          docker rm "$CONTAINER_ID" >/dev/null 2>&1 || true

          sleep 10
          sudo kill $PROF_PID 2>/dev/null || true; wait $PROF_PID 2>/dev/null || true

          echo "${SCENARIO}_Start,$START_TIME,$W3C_TRACEPARENT,$START_EPOCH_MS" > "$SCENARIO_DIR/timestamps.csv"
          echo "${SCENARIO}_End,$END_TIME,$W3C_TRACEPARENT" >> "$SCENARIO_DIR/timestamps.csv"

          node scripts/make_pipeline_spans.js build --input "$RAW_SPANS" --output "$SPANS_JSON" --traceparent "$W3C_TRACEPARENT" --scenario "$SCENARIO"

          ACTUAL_SEC=$(python3 -c "from datetime import datetime; s=datetime.strptime('$START_TIME','%Y-%m-%d %H:%M:%S.%f'); e=datetime.strptime('$END_TIME','%Y-%m-%d %H:%M:%S.%f'); print(round((e-s).total_seconds(),2))")
          USABLE_CAP=$((PROFILER_CAP - 20))
          TRUNCATED=$(python3 -c "print('true' if $ACTUAL_SEC > $USABLE_CAP else 'false')")
          SPAN_COUNT=$(grep -cve '^[[:space:]]*$' "$RAW_SPANS")
          cat > "$SCENARIO_DIR/duration_check.json" << EOFJSON
          {"scenario": "$SCENARIO", "profiler_cap_seconds": $PROFILER_CAP, "usable_cap_seconds": $USABLE_CAP, "actual_duration_seconds": $ACTUAL_SEC, "task_seconds": $ACTUAL_SEC, "truncated": $TRUNCATED, "span_count": $SPAN_COUNT, "failed_span_count": $FAILED_SPAN_COUNT, "calibration_repetitions": 3}
          EOFJSON

          if [ "$SPAN_COUNT" -ne 6 ]; then echo "Expected 6 spans but found $SPAN_COUNT"; exit 1; fi
          if [ "$TRUNCATED" = "true" ]; then echo "TRUNCATED: Test_UI_Spans ran ${ACTUAL_SEC}s but usable cap was ${USABLE_CAP}s"; exit 1; fi
        shell: bash

      # --- INFRASTRUCTURE: Start PostgreSQL + MinIO for Test_Server_Spans ---
      - name: Setup Infrastructure for Test Server Spans
        run: |
          NET_NAME="fider-energy-net-${RUN_ID}"
          docker network create "$NET_NAME" || true

          docker run -d --name "fider-pgtest-${RUN_ID}" --network "$NET_NAME" \
            -e POSTGRES_USER=fider_ci -e POSTGRES_PASSWORD=fider_ci_pw -e POSTGRES_DB=fider_ci \
            postgres:17

          docker run -d --name "fider-s3test-${RUN_ID}" --network "$NET_NAME" \
            -e MINIO_ACCESS_KEY=s3user -e MINIO_SECRET_KEY=s3user-s3cr3t \
            getfider/minio:0.0.2 server /data

          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            docker exec "fider-pgtest-${RUN_ID}" pg_isready -U fider_ci && break || sleep 2
          done

          echo "Building Go binary and running migrations..."
          docker run --rm --network "$NET_NAME" -v "${PWD}:/app" -w /app --platform linux/arm64 \
            -e DATABASE_URL="postgres://fider_ci:fider_ci_pw@fider-pgtest-${RUN_ID}:5432/fider_ci?sslmode=disable" \
            -e BLOB_STORAGE_S3_ENDPOINT_URL="http://fider-s3test-${RUN_ID}:9000" \
            -e BLOB_STORAGE_S3_ACCESS_KEY_ID=s3user \
            -e BLOB_STORAGE_S3_SECRET_ACCESS_KEY=s3user-s3cr3t \
            "$GO_IMAGE" sh -c "mkdir -p dist && go build -ldflags '-s -w' -o fider . && ./fider migrate"
          echo "Infrastructure ready."
        shell: bash

      # --- SCENARIO 6: TEST SERVER SPANS (go test per package) ---
      - name: Profile Test Server Spans
        run: |
          set -euo pipefail
          SCENARIO="Test_Server_Spans"
          SCENARIO_DIR="$DATA_DIR/$SCENARIO"
          RAW_SPANS="$SCENARIO_DIR/pipeline_spans.ndjson"
          SPANS_JSON="$SCENARIO_DIR/spans.json"
          NET_NAME="fider-energy-net-${RUN_ID}"
          DB_URL="postgres://fider_ci:fider_ci_pw@fider-pgtest-${RUN_ID}:5432/fider_ci?sslmode=disable"
          rm -f "$RAW_SPANS" "$SPANS_JSON"

          W3C_TRACEPARENT="00-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]')-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-16)-01"
          PROFILER_CAP=1800
          sudo powermetrics --samplers cpu_power -i 100 -n $((PROFILER_CAP * 10)) > "$SCENARIO_DIR/power_data.txt" 2>/dev/null &
          PROF_PID=$!
          sleep 10

          FAILED_SPAN_COUNT=0
          START_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          START_EPOCH_MS=$(node -e "console.log(Date.now())")

          CONTAINER_ID=$(docker run -d --network "$NET_NAME" -v "${PWD}:/app" -w /app --platform linux/arm64 \
            -e DATABASE_URL="$DB_URL" \
            -e BLOB_STORAGE_S3_ENDPOINT_URL="http://fider-s3test-${RUN_ID}:9000" \
            -e BLOB_STORAGE_S3_ACCESS_KEY_ID=s3user \
            -e BLOB_STORAGE_S3_SECRET_ACCESS_KEY=s3user-s3cr3t \
            "$GO_IMAGE" sleep infinity)
          CONTAINER_ID=$(echo "$CONTAINER_ID" | tr -d '[:space:]')
          if [ -z "$CONTAINER_ID" ]; then echo "Failed to start persistent Go container"; exit 1; fi

          run_go_span() {
            local name="$1" calibration="$2" package="$3"
            local start_ms end_ms exit_code
            start_ms=$(node -e "console.log(Date.now())")
            set +e
            docker exec "$CONTAINER_ID" go test "$package" -short -count=1
            exit_code=$?
            set -e
            end_ms=$(node -e "console.log(Date.now())")
            if [ "$exit_code" -ne 0 ] && [ "$calibration" != "true" ]; then
              FAILED_SPAN_COUNT=$((FAILED_SPAN_COUNT + 1))
              echo "WARNING: Span $name exited $exit_code"
            fi
            node scripts/make_pipeline_spans.js record \
              --output "$RAW_SPANS" --name "$name" --start-ms "$start_ms" --end-ms "$end_ms" \
              --exit-code "$exit_code" --test-path "$package" --command "go test $package -short -count=1" \
              --calibration "$calibration" --operation "gotest-package"
          }

          for REP in 1 2 3; do
            run_go_span "gotest.Calibration.$REP" "true" "./app/models/..."
          done

          for PKG in actions cmd handlers jobs middlewares models pkg services tasks; do
            run_go_span "gotest.$PKG" "false" "./app/$PKG/..."
          done

          END_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")

          docker stop "$CONTAINER_ID" >/dev/null 2>&1 || true
          docker rm "$CONTAINER_ID" >/dev/null 2>&1 || true

          sleep 10
          sudo kill $PROF_PID 2>/dev/null || true; wait $PROF_PID 2>/dev/null || true

          echo "${SCENARIO}_Start,$START_TIME,$W3C_TRACEPARENT,$START_EPOCH_MS" > "$SCENARIO_DIR/timestamps.csv"
          echo "${SCENARIO}_End,$END_TIME,$W3C_TRACEPARENT" >> "$SCENARIO_DIR/timestamps.csv"

          node scripts/make_pipeline_spans.js build --input "$RAW_SPANS" --output "$SPANS_JSON" --traceparent "$W3C_TRACEPARENT" --scenario "$SCENARIO"

          ACTUAL_SEC=$(python3 -c "from datetime import datetime; s=datetime.strptime('$START_TIME','%Y-%m-%d %H:%M:%S.%f'); e=datetime.strptime('$END_TIME','%Y-%m-%d %H:%M:%S.%f'); print(round((e-s).total_seconds(),2))")
          USABLE_CAP=$((PROFILER_CAP - 20))
          TRUNCATED=$(python3 -c "print('true' if $ACTUAL_SEC > $USABLE_CAP else 'false')")
          SPAN_COUNT=$(grep -cve '^[[:space:]]*$' "$RAW_SPANS")
          cat > "$SCENARIO_DIR/duration_check.json" << EOFJSON
          {"scenario": "$SCENARIO", "profiler_cap_seconds": $PROFILER_CAP, "usable_cap_seconds": $USABLE_CAP, "actual_duration_seconds": $ACTUAL_SEC, "task_seconds": $ACTUAL_SEC, "truncated": $TRUNCATED, "span_count": $SPAN_COUNT, "failed_span_count": $FAILED_SPAN_COUNT, "calibration_repetitions": 3}
          EOFJSON

          if [ "$SPAN_COUNT" -ne 12 ]; then echo "Expected 12 spans but found $SPAN_COUNT"; exit 1; fi
          if [ "$TRUNCATED" = "true" ]; then echo "TRUNCATED: Test_Server_Spans ran ${ACTUAL_SEC}s but usable cap was ${USABLE_CAP}s"; exit 1; fi
        shell: bash

      - name: Cleanup Infrastructure
        if: always()
        run: |
          NET_NAME="fider-energy-net-${RUN_ID}"
          docker stop "fider-pgtest-${RUN_ID}" "fider-s3test-${RUN_ID}" 2>/dev/null || true
          docker rm   "fider-pgtest-${RUN_ID}" "fider-s3test-${RUN_ID}" 2>/dev/null || true
          docker network rm "$NET_NAME" 2>/dev/null || true
          echo "Infrastructure cleaned up."
        shell: bash

      # --- CONVERT: powermetrics → timechart.csv ---
      - name: Convert powermetrics to timechart.csv
        if: always()
        run: python3 scripts/parse_powermetrics.py "$RUN_ID"
        shell: bash

      - name: Validate Converted Data
        if: always()
        run: |
          set -euo pipefail
          FAIL=0
          for SCENARIO in Idle NPM_Install Build_Server Build_UI Test_UI_Spans Test_Server_Spans; do
            CSV="$DATA_DIR/$SCENARIO/timechart.csv"
            TS="$DATA_DIR/$SCENARIO/timestamps.csv"
            if [ ! -s "$CSV" ]; then echo "ERROR: MISSING or EMPTY: $CSV"; FAIL=1
            else
              ROWS=$(tail -n +3 "$CSV" | wc -l | tr -d ' ')
              if [ "$ROWS" -lt 1 ]; then echo "ERROR: $CSV has 0 data rows"; FAIL=1
              else echo "OK: $SCENARIO: $ROWS data rows"; fi
            fi
            if [ ! -s "$TS" ]; then echo "ERROR: MISSING or EMPTY: $TS"; FAIL=1; fi
            if [ "$SCENARIO" = "Test_UI_Spans" ] || [ "$SCENARIO" = "Test_Server_Spans" ]; then
              if [ ! -s "$DATA_DIR/$SCENARIO/spans.json" ]; then echo "ERROR: MISSING or EMPTY: $SCENARIO/spans.json"; FAIL=1; fi
            fi
          done
          if [ $FAIL -eq 1 ]; then echo "ERROR: VALIDATION FAILED — corrupt data will NOT be uploaded"; exit 1
          else echo "OK: All telemetry files validated successfully"; fi
        shell: bash

      - name: Upload Traces as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-traces-${{ env.RUN_ID }}
          path: ${{ env.DATA_DIR }}
          retention-days: 90

      - name: Offload to MinIO Bucket
        run: |
          set -euo pipefail
          for SCENARIO in Idle NPM_Install Build_Server Build_UI Test_UI_Spans Test_Server_Spans; do
            SCENARIO_DIR="$DATA_DIR/$SCENARIO"
            for REQUIRED in "$SCENARIO_DIR/timechart.csv" "$SCENARIO_DIR/timestamps.csv"; do
              if [ ! -s "$REQUIRED" ]; then echo "ERROR: Missing or empty: $REQUIRED"; exit 1; fi
            done
            FILES=("$SCENARIO_DIR/timechart.csv" "$SCENARIO_DIR/timestamps.csv")
            if [ -f "$SCENARIO_DIR/duration_check.json" ]; then FILES+=("$SCENARIO_DIR/duration_check.json"); fi
            if [ "$SCENARIO" = "Test_UI_Spans" ] || [ "$SCENARIO" = "Test_Server_Spans" ]; then
              if [ ! -s "$SCENARIO_DIR/spans.json" ]; then echo "ERROR: Missing spans.json for $SCENARIO"; exit 1; fi
              FILES+=("$SCENARIO_DIR/spans.json")
            fi
            zip -j "$DATA_DIR/${SCENARIO}.zip" "${FILES[@]}"
            zip -T "$DATA_DIR/${SCENARIO}.zip"
          done

          docker run --rm -v "$DATA_DIR:/data" --entrypoint sh minio/mc -c "\
            mc alias set myminio http://100.67.86.32:9000 researcher supersecretpassword && \
            mc cp /data/hardware_metadata.json myminio/energy-research-data/raw-telemetry/$PROJECT_NAME/$RUN_ID/hardware_metadata.json && \
            mc cp /data/Idle.zip                    myminio/energy-research-data/raw-telemetry/$PROJECT_NAME/$RUN_ID/Idle.zip && \
            mc cp /data/NPM_Install.zip             myminio/energy-research-data/raw-telemetry/$PROJECT_NAME/$RUN_ID/NPM_Install.zip && \
            mc cp /data/Build_Server.zip            myminio/energy-research-data/raw-telemetry/$PROJECT_NAME/$RUN_ID/Build_Server.zip && \
            mc cp /data/Build_UI.zip                myminio/energy-research-data/raw-telemetry/$PROJECT_NAME/$RUN_ID/Build_UI.zip && \
            mc cp /data/Test_UI_Spans.zip           myminio/energy-research-data/raw-telemetry/$PROJECT_NAME/$RUN_ID/Test_UI_Spans.zip && \
            mc cp /data/Test_Server_Spans.zip       myminio/energy-research-data/raw-telemetry/$PROJECT_NAME/$RUN_ID/Test_Server_Spans.zip"

          rm -rf "$DATA_DIR"
        shell: bash
